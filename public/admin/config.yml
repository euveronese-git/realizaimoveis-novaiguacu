backend:
  name: git-gateway
  branch: main

local_backend: true

site_url: https://realizaimoveis-novaiguacu.netlify.app
display_url: https://realizaimoveis-novaiguacu.netlify.app

media_folder: public/uploads
public_folder: /uploads

media_library:
  name: cloudinary
  config:
    cloud_name: qodjrluz
    api_key: "823687155364381"
    folder: realiza/imoveis
    default_transformations:
      - - fetch_format: auto
          quality: auto
          crop: limit
          width: 1600

locale: pt

collections:
  - name: properties
    label: Imóveis
    label_singular: Imóvel
    folder: content/properties
    create: true
    delete: true
    slug: "{{id}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}} — {{code}}"
    fields:
      - { label: ID, name: id, widget: string, hint: "Ex: rz-ni-101 (usado no nome do arquivo)" }
      - { label: Código / Referência, name: code, widget: string, hint: "Ex: RZ-NI101" }
      - { label: Título, name: title, widget: string }
      - label: Tipo
        name: type
        widget: select
        options:
          - { label: Casa, value: casa }
          - { label: Apartamento, value: apartamento }
          - { label: Cobertura, value: cobertura }
          - { label: Comercial, value: comercial }
          - { label: Terreno, value: terreno }
      - label: Categoria
        name: category
        widget: select
        options:
          - { label: Lançamento MCMV, value: lancamento_mcmv }
          - { label: Pronto para morar MCMV, value: pronto_mcmv }
          - { label: Médio / Alto Padrão, value: alto_padrao }
          - { label: Imóveis comerciais, value: comercial }
          - { label: Venda, value: venda }
          - { label: Aluguel, value: aluguel }
          - { label: Lançamento, value: lancamento }
      - label: Preço (R$)
        name: price
        widget: number
        value_type: int
        hint: "Valor completo em reais. Ex: 230000 para aparecer R$ 230.000 — não digite 230."
      - label: Condomínio (R$)
        name: condoFee
        widget: number
        value_type: int
        required: false
        hint: "Valor mensal do condomínio, não o preço de venda. Ex: 310"
      - label: IPTU anual (R$)
        name: iptuAnnual
        widget: number
        value_type: int
        required: false
        hint: "IPTU do ano, em reais. Ex: 420"
      - { label: Bairro / Região, name: neighborhood, widget: string }
      - { label: Endereço, name: address, widget: string }
      - { label: Cidade, name: city, widget: string, default: "Nova Iguaçu" }
      - { label: Estado, name: state, widget: string, default: "RJ" }
      - { label: Quartos, name: bedrooms, widget: number, value_type: int, default: 0 }
      - { label: Banheiros, name: bathrooms, widget: number, value_type: int, default: 0 }
      - { label: Suítes, name: suites, widget: number, value_type: int, default: 0 }
      - { label: Vagas, name: parkingSpaces, widget: number, value_type: int, default: 0 }
      - { label: Área (m²), name: areaSqM, widget: number, value_type: int }
      - { label: Destaque, name: featured, widget: boolean, default: false }
      - { label: Badge de destaque, name: featuredBadge, widget: string, required: false }
      - { label: Elegível MCMV, name: isMcmvEligible, widget: boolean, required: false, default: false }
      - label: Entrada mínima (R$)
        name: downPaymentMin
        widget: number
        value_type: int
        required: false
        hint: "Valor de entrada em reais. Ex: 15000 para R$ 15.000"
      - { label: Descrição, name: description, widget: text }
      - label: Fotos
        name: images
        widget: list
        allow_add: true
        min: 1
        hint: "Abra o Cloudinary e escolha as fotos. Elas aparecem na galeria do anúncio."
        field:
          label: Foto
          name: image
          widget: image
          choose_url: true
      - label: Vídeos
        name: videos
        widget: list
        required: false
        allow_add: true
        hint: "O vídeo toca dentro do anúncio. Prefira arquivo curto (até 1–2 min), não 4K longo."
        field:
          label: Vídeo
          name: video
          widget: file
          choose_url: true
      - label: Características
        name: features
        widget: list
        allow_add: true
        hint: "Um item por linha, ex: Portaria 24 horas"
        field: { label: Item, name: feature, widget: string }
      - label: Data de cadastro
        name: createdAt
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
